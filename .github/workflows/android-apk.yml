name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK'yı kur (yeniden denemeli)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | head -10 || true
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            if "$SDKM" "ndk;27.1.12297006"; then
              exit 0
            fi
            echo "NDK deneme $i başarısız, tekrar deneniyor..."
            sleep 10
          done
          exit 1

      - name: Bağımlılıkları kur
        run: npm ci --legacy-peer-deps

      - name: APK derle (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK'yı doğrula (imza ve minimum Android sürümü)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK" | head -12
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|native-code"

      - name: GitHub Release olarak yayınla (zip'siz doğrudan indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk iptv-player.apk
          gh release create "build-${{ github.run_number }}" iptv-player.apk \
            --title "Derleme #${{ github.run_number }}" \
            --notes "Telefona doğrudan kurulabilir APK (zip değildir)." \
            --prerelease
