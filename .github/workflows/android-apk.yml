name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK'yı kur (yeniden denemeli)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | head -10 || true
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            if "$SDKM" "ndk;27.1.12297006"; then
              exit 0
            fi
            echo "NDK deneme $i başarısız, tekrar deneniyor..."
            sleep 10
          done
          exit 1

      - name: Bağımlılıkları kur
        run: npm ci --legacy-peer-deps

      - name: APK derle (release - PashaPlay, ParisPlayer, PashaPlay TV)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assemblePashaRelease assembleParisRelease assemblePashaTvRelease --no-daemon

      - name: APK'ları doğrula (imza, minimum Android sürümü, boyut)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          for APK in android/app/build/outputs/apk/*/release/*.apk; do
            echo "== $APK"
            ls -la "$APK"
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK" | head -4
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -E "^package|^application-label:|^sdkVersion|^native-code"
          done

      - name: APK'ları yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: GitHub Release olarak yayınla (zip'siz doğrudan indirme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=android/app/build/outputs/apk/pasha/release
          Q=android/app/build/outputs/apk/paris/release
          cp "$P/app-pasha-arm64-v8a-release.apk"   PashaPlay-arm64.apk
          cp "$P/app-pasha-armeabi-v7a-release.apk" PashaPlay-arm32-eski-cihaz.apk
          cp "$Q/app-paris-arm64-v8a-release.apk"   ParisPlayer-arm64.apk
          cp "$Q/app-paris-armeabi-v7a-release.apk" ParisPlayer-arm32-eski-cihaz.apk
          T=android/app/build/outputs/apk/pashaTv/release
          cp "$T/app-pashaTv-arm64-v8a-release.apk"   PashaPlay-TV-arm64.apk
          cp "$T/app-pashaTv-armeabi-v7a-release.apk" PashaPlay-TV-arm32.apk
          gh release create "build-${{ github.run_number }}" \
            PashaPlay-arm64.apk PashaPlay-arm32-eski-cihaz.apk \
            ParisPlayer-arm64.apk ParisPlayer-arm32-eski-cihaz.apk \
            PashaPlay-TV-arm64.apk PashaPlay-TV-arm32.apk \
            --title "PashaPlay + ParisPlayer + TV #${{ github.run_number }}" \
            --notes "Çoğu telefon için *-arm64.apk dosyasını kurun. Yalnızca eski 32-bit telefon/TV kutusu için *-arm32-eski-cihaz.apk kullanın. Android TV / TV kutusu için PashaPlay-TV-arm64.apk (yeni TV) veya PashaPlay-TV-arm32.apk (eski TV kutusu)." \
            --latest
