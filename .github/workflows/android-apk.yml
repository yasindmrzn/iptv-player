name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK bileşenlerini kur (yeniden denemeli)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for i in 1 2 3; do
            if "$SDKM" "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"; then
              exit 0
            fi
            echo "Deneme $i başarısız, tekrar deneniyor..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            sleep 10
          done
          exit 1

      - name: Bağımlılıkları kur
        run: npm ci --legacy-peer-deps

      - name: APK derle (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
